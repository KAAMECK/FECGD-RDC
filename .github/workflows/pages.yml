name: Publier le site sur GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/dist/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5
      - name: Préparer les fichiers publics
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
